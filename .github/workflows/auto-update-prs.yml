name: Auto-update PR branches

# Drags open PRs forward onto main so nobody has to click "Update branch".
#
# WHY THIS EXISTS RATHER THAN A MERGE QUEUE. GitHub's merge queue is the real
# answer to this problem — it tests each PR restacked on current main and merges
# only if that combination is green, so a semantic collision (two PRs each green
# apart, broken together) never reaches main. It is unavailable here: merge queue
# requires an ORGANISATION-owned repository, and saltV2 is owned by a personal
# account. Public vs private is not the constraint; the account type is. So the
# "Main branch" ruleset keeps strict_required_status_checks_policy and this
# workflow automates the update the policy demands.
#
# What that buys and what it does not: the manual click goes away, and a
# collision still lands on a PR branch rather than on main (strict is still on,
# so a behind-branch cannot merge). What is NOT bought is the queue's
# speculation — updates here are serial, so N queued PRs cost N sequential
# update-and-re-run cycles rather than one batched run. That is the price of the
# account type, not a design choice.
#
# SCOPE: only PRs with auto-merge ENABLED. That flag is the opt-in — its author
# has already said "land this when it goes green", so dragging it forward is
# what they asked for. Everything else is left alone, which deliberately spares
# /run's draft PRs: they push per phase and rebase themselves (see
# .claude/commands/run.md), and an unasked-for merge commit mid-run would fight
# that rebase.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# The PAT below carries the write access. GITHUB_TOKEN needs nothing here.
permissions:
  contents: read

# Only the newest main matters. If two merges land back-to-back, updating
# against the older one is work that the newer run immediately redoes.
concurrency:
  group: auto-update-prs
  cancel-in-progress: true

jobs:
  update:
    name: Update auto-merge PRs
    runs-on: ubuntu-latest
    steps:
      - name: Update every auto-merge PR that has fallen behind main
        env:
          # MUST NOT be GITHUB_TOKEN. A branch update made with GITHUB_TOKEN does
          # not create a workflow run (GitHub suppresses it to prevent recursive
          # runs), so CI would never report on the new head sha, the required
          # checks would sit pending forever, and auto-merge would hang instead
          # of merging — strictly worse than the manual click this replaces. A
          # fine-grained PAT with Contents: write + Pull requests: write on this
          # repo produces a real `synchronize` event.
          GH_TOKEN: ${{ secrets.PAT_AUTO_UPDATE }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Absent secret skips green rather than failing, matching chromatic.yml:
          # this workflow is a convenience, and main going red because a token was
          # never installed would be a worse failure than the click coming back.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::PAT_AUTO_UPDATE is not set — no PR branches updated."
            exit 0
          fi

          # mergeStateStatus is computed asynchronously, so a PR queried straight
          # after a push to main reports UNKNOWN. Retry briefly; anything still
          # unresolved is picked up by the next push to main, so this never needs
          # to block for long.
          prs='[]'
          for attempt in 1 2 3; do
            prs=$(gh pr list --repo "$REPO" --base main --state open \
              --json number,autoMergeRequest,mergeStateStatus \
              --jq '[.[] | select(.autoMergeRequest != null)]')
            if ! echo "$prs" | jq -e 'any(.[]; .mergeStateStatus == "UNKNOWN")' > /dev/null; then
              break
            fi
            echo "mergeStateStatus still UNKNOWN on at least one PR — retrying (attempt $attempt/3)."
            sleep 10
          done

          echo "Auto-merge PRs open against main:"
          echo "$prs" | jq -r '.[] | "  #\(.number) — \(.mergeStateStatus)"'

          # BEHIND is precisely "out of date with base", which is the one state
          # strict mode blocks and an update fixes. DIRTY (a real conflict) is
          # deliberately excluded: update-branch cannot resolve it and the choice
          # belongs to a human.
          behind=$(echo "$prs" | jq -r '.[] | select(.mergeStateStatus == "BEHIND") | .number')

          if [ -z "$behind" ]; then
            echo "Nothing behind main — no updates needed."
            exit 0
          fi

          # The REST endpoint rather than `gh pr update-branch`: that subcommand
          # only exists in newer gh releases, while `gh api` and this endpoint
          # work on any runner image. It merges main into the PR branch — never a
          # rebase, so a contributor's history is never rewritten, and the squash
          # merge collapses the extra commit away at merge time anyway. 202 is the
          # success code; the update itself completes asynchronously.
          failed=0
          for pr in $behind; do
            echo "Updating #$pr…"
            if gh api --method PUT "repos/$REPO/pulls/$pr/update-branch" --silent; then
              echo "::notice::Updated #$pr with main; its CI re-runs now."
            else
              # One PR failing (a conflict that appeared since the query, or a
              # race with a concurrent push) must not deny the others their
              # update, so this warns and carries on rather than exiting.
              echo "::warning::Could not update #$pr — leaving it for its author."
              failed=$((failed + 1))
            fi
          done

          echo "Done. $failed PR(s) could not be updated."
