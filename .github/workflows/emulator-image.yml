# Publishes the test-emulator runtime image to GHCR (issue #580).
#
# WHY: docker/test-emulators/Dockerfile fetches a Temurin JRE from
# packages.adoptium.net and firebase-tools + the emulator jars from npm. Both
# the e2e and the Vitest-integration jobs built it from scratch on every run, so
# every CI run depended on two third-party registries staying up and fast. On
# 2026-07-24 that cost run 30087640130 an 8-minute npm install and then killed
# it outright on `apt-get install temurin-21-jre` (exit 100). Building the image
# ONCE per Dockerfile change and pulling it thereafter removes both from the
# critical path.
#
# The tag is a content hash of the build inputs, so the reference is
# self-invalidating: edit the Dockerfile or healthcheck.sh and CI asks for a tag
# that does not exist yet, misses, and builds locally (correct, just slower)
# until this workflow republishes on merge. A published image can therefore
# never be silently stale relative to the Dockerfile in the tree — which is what
# makes the pull safe to trust in the first place.
#
# The hash is computed in shell here and in ci.yml, identically:
#   cat Dockerfile healthcheck.sh | sha256sum | cut -c1-16
# Keep the two in sync — a mismatch is not a failure (it degrades to a local
# build) but it silently wastes the cache.
name: Emulator image

on:
  push:
    branches: [main]
    # The workflow's own path is included deliberately: it means merging this
    # file publishes the first image, with no manual dispatch needed.
    paths:
      - 'docker/test-emulators/Dockerfile'
      - 'docker/test-emulators/healthcheck.sh'
      - '.github/workflows/emulator-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A second push while a build is in flight makes the older one pointless.
concurrency:
  group: emulator-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Compute image reference
        id: image
        run: |
          set -euo pipefail
          tag=$(cat docker/test-emulators/Dockerfile docker/test-emulators/healthcheck.sh \
            | sha256sum | cut -c1-16)
          # GHCR rejects uppercase in the image path; the GitHub owner may contain it.
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/salt-test-emulators:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Already published (a docs-only touch to this workflow, or a re-dispatch)
      # — the content hash is unchanged, so there is nothing to rebuild.
      - name: Skip if already published
        id: exists
        run: |
          if docker manifest inspect '${{ steps.image.outputs.ref }}' >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.image.outputs.ref }} already published — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          docker build -t '${{ steps.image.outputs.ref }}' docker/test-emulators
          docker push '${{ steps.image.outputs.ref }}'
          echo "Published ${{ steps.image.outputs.ref }}"
