# pnpm + Node + a frozen-lockfile install, with the pnpm store cached.
#
# A composite action rather than copy-pasted steps because EVERY job in ci.yml
# needs this identical preamble, and both the pnpm version and the Node major
# are pins that must not drift between jobs — one copy is one place to bump.
# Callers still run actions/checkout themselves; this action assumes the
# workspace is already checked out.
name: Workspace
description: Set up pnpm + Node and install the workspace with a frozen lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: '10.33.0'

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
